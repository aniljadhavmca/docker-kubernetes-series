<!DOCTYPE html>
<html>
<head>
  <title>Payment Service</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f0fdf4;
    }

    .header{
      background:#166534;
      color:white;
      padding:20px;
      font-size:28px;
      font-weight:bold;
    }

    .container{
      padding:40px;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      text-align:center;
    }

    .success{
      color:green;
      font-size:32px;
      font-weight:bold;
    }
  </style>

</head>

<body>

<div class="header">
  Payment Service
</div>

<div class="container">

<div class="card">

<div class="success">
  Payment Successful ✅
</div>

<h2>Order Confirmed</h2>

<p>Your order has been placed successfully.</p>

</div>

</div>

</body>
</html>
