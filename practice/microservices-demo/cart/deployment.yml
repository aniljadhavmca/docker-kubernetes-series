apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-deployment
  namespace: commerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cart

  template:
    metadata:
      labels:
        app: cart

    spec:
      containers:
      - name: cart-container
        image: nginx:latest

        ports:
        - containerPort: 80
