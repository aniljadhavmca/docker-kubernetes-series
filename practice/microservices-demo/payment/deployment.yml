apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-deployment
  namespace: commerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment

  template:
    metadata:
      labels:
        app: payment

    spec:
      containers:
      - name: payment-container
        image: nginx:latest

        ports:
        - containerPort: 80
