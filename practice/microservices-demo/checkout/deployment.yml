apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkout-deployment
  namespace: commerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: checkout

  template:
    metadata:
      labels:
        app: checkout

    spec:
      containers:
      - name: checkout-container
        image: nginx:latest

        ports:
        - containerPort: 80
