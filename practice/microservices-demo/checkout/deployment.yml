apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkout-deployment
  namespace: commerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: checkout

  template:
    metadata:
      labels:
        app: checkout

    spec:
      containers:
      - name: checkout-container
        image: nginx:latest

        ports:
        - containerPort: 80

        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html

      volumes:
      - name: html-volume
        configMap:
          name: checkout-html
